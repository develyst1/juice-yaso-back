services:
  postgres:
    image: postgres:17-alpine
    container_name: juice-yaso-db
    environment:
      POSTGRES_USER: juice
      POSTGRES_PASSWORD: juice
      POSTGRES_DB: juice_yaso
    ports:
      - "5432:5432"
    volumes:
      - juice_yaso_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juice -d juice_yaso"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  juice_yaso_pgdata:
